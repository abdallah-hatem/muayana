# Local infrastructure for Muayana.
# Run with the project name muayana:  docker compose -p muayana up -d   (or: npm run db:up)
# Host Postgres port 5442 (never 5432) so it runs beside other projects' databases.
# Databases: muayana (development) and muayana_test (e2e only; teardown deletes rows there).
name: muayana

services:
  db:
    image: postgres:16
    container_name: muayana-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: muayana
    ports:
      - '5442:5432'
    volumes:
      - muayana-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d muayana']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  muayana-pgdata:
    name: muayana-pgdata
